name: 发布 npm 包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      full: true

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0 --config.auto-install-peers=true --config.strictDepBuilds=false
      - run: npm run verify
      - name: 校验正式发布标签
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $version = (Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") { throw '必须选择与包版本一致的 v 标签发布。' }
      - name: 发布前校验双语发行说明
        run: node scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"

      - run: npm publish

  release-notes:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
