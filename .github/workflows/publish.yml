name: 发布 npm 包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.3' }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0 --config.auto-install-peers=true --config.strictDepBuilds=false
      - run: npm run verify
      - name: 校验正式发布标签
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $version = (Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v1.1.3' }
          if ($tag -ne "v$version") { throw '必须选择与包版本一致的 v 标签发布。' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 发布前校验双语发行说明
        run: node scripts/extract-release-notes.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - run: npm install -g npm@11
      - run: npm publish

  release-notes:
    if: github.ref_type == 'tag'
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
